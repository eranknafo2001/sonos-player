name: Publish HA repo

on:
  push:
    branches:
      - main
    paths:
      - "packages/core/**"
      - "packages/headless/**"
      - "packages/ha-addon/**"
      - "packages/ha-integration/**"
      - "scripts/export-ha.ts"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/publish-ha-repo.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump version
        run: |
          # Read current version from addon config
          CURRENT=$(grep '^version:' packages/ha-addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Bumping version: ${CURRENT} -> ${NEW_VERSION}"

          # Update addon config
          sed -i "s/^version: \".*\"/version: \"${NEW_VERSION}\"/" packages/ha-addon/config.yaml

          # Update integration manifest
          sed -i "s/\"version\": \".*\"/\"version\": \"${NEW_VERSION}\"/" packages/ha-integration/custom_components/sonos_player/manifest.json

          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Export HA repository contents
        run: bun export:ha

      - name: Checkout target repo
        env:
          TARGET_REPO: eranknafo2001/sonos-player-ha
          TARGET_TOKEN: ${{ secrets.HA_PUBLISH_TOKEN }}
        run: |
          test -n "$TARGET_TOKEN"
          git clone "https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git" /tmp/sonos-player-ha

      - name: Sync exported files
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            dist/ha-publish/ /tmp/sonos-player-ha/

      - name: Commit and push if changed
        env:
          TARGET_TOKEN: ${{ secrets.HA_PUBLISH_TOKEN }}
        run: |
          cd /tmp/sonos-player-ha
          git config user.name "sonos-player bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish"
            exit 0
          fi

          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No staged changes to publish"
            exit 0
          fi

          git commit -m "v${NEW_VERSION} — publish from eranknafo2001/sonos-player@${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Commit version bump back to source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "sonos-player bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet; then
            echo "No version bump to commit back"
            exit 0
          fi

          git add packages/ha-addon/config.yaml packages/ha-integration/custom_components/sonos_player/manifest.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push
