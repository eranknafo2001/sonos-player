name: Publish HA repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump version and export HA repository
        run: |
          BUMP_VERSION=true bun export:ha

          # Read the new version from the bumped config
          NEW_VERSION=$(grep '^version:' packages/ha-addon/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "Exported version: ${NEW_VERSION}"

      - name: Verify export
        run: |
          echo "Exported files:"
          find dist/ha-publish -type f | sort
          echo "---"
          echo "Addon version:"
          grep version dist/ha-publish/sonos_player/config.yaml
          echo "Integration version:"
          grep version dist/ha-publish/custom_components/sonos_player/manifest.json

      - name: Checkout target repo
        run: |
          git clone "https://x-access-token:${{ secrets.HA_PUBLISH_TOKEN }}@github.com/eranknafo2001/sonos-player-ha.git" /tmp/sonos-player-ha

      - name: Sync exported files
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            dist/ha-publish/ /tmp/sonos-player-ha/

      - name: Commit and push to HA repo
        run: |
          cd /tmp/sonos-player-ha
          git config user.name "sonos-player bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A
          git status
          git commit -m "v${NEW_VERSION} — publish from eranknafo2001/sonos-player@${GITHUB_SHA}"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin HEAD:main --tags
          echo "Published v${NEW_VERSION} to sonos-player-ha"

      - name: Commit version bump back to source
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "sonos-player bot"
          git config user.email "actions@users.noreply.github.com"

          git add packages/ha-addon/config.yaml packages/ha-integration/custom_components/sonos_player/manifest.json
          if git diff --cached --quiet; then
            echo "No version bump to commit back"
            exit 0
          fi

          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push
          echo "Version ${NEW_VERSION} committed back to source"
